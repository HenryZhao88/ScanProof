[project]
name = "scanproof"
version = "0.1.0"
description = "Reliability evaluation for a chest X-ray classifier. Research prototype — not for diagnosis."
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "numpy>=1.26",
  "pillow>=10.0",
  "scikit-learn>=1.4",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "medmnist>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scanproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
